# Demo del widget (IIFE + MSW) — https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Netlify legacy; prod demo usa demo.social2game.com (S3) con API real
  VITE_API_BASE_URL = "https://api.social2game.com"
  VITE_DEMO_TENANT_ID = "6b67e761-b833-402b-8d59-81c478ac782b"
  VITE_USE_MOCKS = "false"
  # Piloto social: abre en Social, perfil público, banner
  VITE_PILOT_SOCIAL = "true"

# React Router (BrowserRouter) + rutas como /demo
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
