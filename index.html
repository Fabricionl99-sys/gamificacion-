<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Widget Gamificacion iGaming</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E13'/%3E%3Cpath d='M9 22V10h3l5.5 7.2V10H23v12h-3l-5.5-7.2V22H9z' fill='%230AF784'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SW kill switch: en prod NO usamos service workers (MSW es solo dev).
      // Visitors que cargaron el widget cuando MSW estaba activo dejaron
      // mockServiceWorker.js registrado que sigue interceptando requests con
      // data mockeada — rompe la entrega de cambios del BO al widget. Limpiamos
      // inmediatamente al cargar la página, antes de que el bundle haga fetch.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () { /* no-op */ });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
