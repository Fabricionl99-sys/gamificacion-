<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>WINGOAT · Widget jugador demo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/gamification-widget.css" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      /*
        Sprint #6 fix: usar var() con fallback en vez de valores hardcoded.
        Antes el background/color/font hardcoded sobrescribía las CSS vars
        que applyBranding setea en :root → el operador cambiaba branding
        pero el body seguía con verde-negro original.
      */
      body {
        background: var(--bg-primary, #0a0e13);
        color: var(--text-primary, #ffffff);
        font-family: var(--font-family, Urbanist, system-ui, sans-serif);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.process = window.process || { env: { NODE_ENV: 'production' } };
      window.process.env = window.process.env || { NODE_ENV: 'production' };
      // Solo des-registrar MSW; /service-worker.js de push queda intacto.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            var script =
              (r.active && r.active.scriptURL) ||
              (r.waiting && r.waiting.scriptURL) ||
              (r.installing && r.installing.scriptURL) ||
              '';
            if (script.indexOf('mockServiceWorker.js') !== -1) {
              r.unregister();
            }
          });
        }).catch(function () { /* no-op */ });
      }
    </script>
    <!-- Cache buster: bump cuando se publique fix critico para forzar
         que browsers + intermediaries bypaseen el cache del iife.js
         (filename no tiene hash, sino lo cachearian\342\200\224arian para siempre). -->
    <script src="/gamification-widget.iife.js?v=20260524-push2"></script>
  </body>
</html>
